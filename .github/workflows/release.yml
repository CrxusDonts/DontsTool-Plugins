name: Build & Release Plugins

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Swift unit tests
        run: swift test

      - name: Determine release version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Universal release packages
        run: |
          chmod +x scripts/build-release.sh
          scripts/build-release.sh --version "${{ steps.version.outputs.value }}" --repo "${{ github.repository }}" --universal

      - name: Smoke test packaged plugins
        run: |
          python3 - <<'PY'
          import glob, json, os, subprocess, tempfile

          with open("dist/catalog.json", "r", encoding="utf-8") as f:
              catalog_by_id = {entry["id"]: entry for entry in json.load(f)["plugins"]}

          zips = sorted(glob.glob("dist/*.dontsplugin.zip"))
          assert len(zips) == 7, f"Expected 7 zips, found {len(zips)}"
          assert len(catalog_by_id) == 7, f"Expected 7 catalog entries, found {len(catalog_by_id)}"

          for zpath in zips:
              with tempfile.TemporaryDirectory() as tmp:
                  subprocess.run(["ditto", "-xk", zpath, tmp], check=True)
                  manifest_path = os.path.join(tmp, "manifest.json")
                  assert os.path.isfile(manifest_path), f"Missing manifest.json in {zpath}"
                  with open(manifest_path, "r", encoding="utf-8") as f:
                      manifest = json.load(f)
                  catalog_entry = catalog_by_id[manifest["id"]]
                  subpath = catalog_entry.get("subpath")
                  assert not subpath or os.path.isfile(os.path.join(tmp, subpath, "manifest.json")), (
                      f"Invalid subpath {subpath!r} in catalog.json for standalone archive {zpath}"
                  )
                  cmd = [os.path.join(tmp, manifest["runtime"]["command"][0])] + manifest["runtime"]["command"][1:]
                  assert os.access(cmd[0], os.X_OK), f"Entrypoint not executable: {cmd[0]}"
                  keyword = manifest["keywords"][0]
                  payload = (
                      json.dumps({
                          "jsonrpc": "2.0",
                          "id": 1,
                          "method": "search",
                          "params": {
                              "mode": "keyword",
                              "keyword": keyword,
                              "query": "",
                              "rawQuery": keyword,
                              "preferences": {},
                              "hostContext": {
                                  "hostVersion": "0.4.0",
                                  "aiConfigured": "true",
                                  "aiFormat": "gemini",
                                  "aiModel": "gemini-2.5-flash",
                              },
                          },
                      })
                      + "\n"
                      + json.dumps({"jsonrpc": "2.0", "method": "shutdown", "params": {}})
                      + "\n"
                  )
                  proc = subprocess.run(cmd, input=payload, text=True, capture_output=True, timeout=5, check=True)
                  line = proc.stdout.strip().splitlines()[0]
                  resp = json.loads(line)
                  assert resp.get("jsonrpc") == "2.0" and resp.get("id") == 1 and "result" in resp, resp
                  print(f"Smoke OK: {manifest['id']} ({len(resp['result']['items'])} items)")
          PY

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            ASSET_COUNT="$(gh release view "$TAG" --json assets --jq '.assets | length')"
            if [[ "$ASSET_COUNT" -gt 0 ]]; then
              echo "Release ${TAG} already exists with ${ASSET_COUNT} assets; skipping overwrite."
              exit 0
            fi
            gh release upload "$TAG" dist/*.dontsplugin.zip dist/catalog.json --clobber
          else
            gh release create "$TAG" dist/*.dontsplugin.zip dist/catalog.json \
              --title "DontsTool Plugins ${TAG}" \
              --notes "DontsTool 官方插件集合 ${TAG}（Universal macOS 二进制与 catalog.json 校验索引）。"
          fi
